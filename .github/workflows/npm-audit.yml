name: npm audit and checks

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  audit-and-check:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install holepunch-sidecar dependencies
        run: npm ci --prefix holepunch-sidecar

      - name: Install desktop-electron dependencies
        run: npm ci --prefix desktop-electron

      - name: Install poke-gateway dependencies
        run: npm ci --prefix poke-gateway

      - name: Install native-wrapper dependencies
        run: npm ci --prefix native-wrapper

      - name: Audit root
        run: npm audit --audit-level=high

      - name: Audit holepunch-sidecar
        run: npm audit --audit-level=high --prefix holepunch-sidecar

      - name: Audit desktop-electron
        run: npm audit --audit-level=high --prefix desktop-electron

      - name: Audit poke-gateway
        run: npm audit --audit-level=high --prefix poke-gateway

      - name: Audit native-wrapper
        run: npm audit --audit-level=high --prefix native-wrapper

      - name: Typecheck
        run: npm run types

      - name: Project checks
        run: npm run check

      - name: Tests (root)
        run: npm test

      - name: Tests (holepunch-sidecar)
        run: npm test --prefix holepunch-sidecar

      - name: Tests (desktop-electron)
        run: npm test --prefix desktop-electron

      - name: Tests (poke-gateway)
        run: npm test --prefix poke-gateway

      - name: Tests (native-wrapper)
        run: npm test --prefix native-wrapper
