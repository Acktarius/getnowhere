name: Build signed APK (F-Droid)

on:
  push:
    tags:
      - "*-f-droid"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;36.0.0"
          yes | sdkmanager --licenses
          echo "APKSIGNER=$ANDROID_HOME/build-tools/34.0.0/apksigner" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Install native-wrapper dependencies
        working-directory: native-wrapper
        run: npm ci

      - name: Prebuild Android (generate android/ tree)
        working-directory: native-wrapper
        run: npx expo prebuild --platform android --clean

      - name: Apply F-Droid de-Google fixes
        run: python3 scripts/fix-for-fdroid.py

      - name: Build unsigned release APK
        run: npm run mobile:android:release

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Missing required secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD"
            exit 1
          fi

          mkdir -p keys
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > keys/release-keystore.jks
          decoded_size=$(wc -c < keys/release-keystore.jks)
          if [ "$decoded_size" -lt 500 ]; then
            echo "Decoded keystore is only ${decoded_size} bytes — ANDROID_KEYSTORE_BASE64 is truncated or invalid"
            exit 1
          fi

          echo "ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS:-getnowhere}" >> "$GITHUB_ENV"

      - name: Sign release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APK=$(find native-wrapper/builds -maxdepth 1 -name "GetNowHere-v*.apk" ! -name "*-signed.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "Release APK not found in native-wrapper/builds/"
            exit 1
          fi

          echo "Signing: $APK"

          "$APKSIGNER" sign \
            --ks keys/release-keystore.jks \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "${APK}.signed" \
            "$APK"

          mv "${APK}.signed" "$APK"
          sha256sum "$APK" | cut -d' ' -f1 > "$APK.sha256"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Verify signed artifact
        run: |
          test -f native-wrapper/builds/GetNowHere-v*.apk
          echo "Found signed APK: $(ls -lh native-wrapper/builds/GetNowHere-v*.apk)"

      - name: Remove signing files
        if: always()
        run: |
          rm -f keys/release-keystore.jks

      - name: Create GitHub release
        if: github.ref_type == 'tag' && endsWith(github.ref_name, '-f-droid')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            native-wrapper/builds/*.apk
            native-wrapper/builds/*.sha256
          generate_release_notes: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: getnowhere-signed-apk
          path: |
            native-wrapper/builds/*.apk
            native-wrapper/builds/*.sha256
          if-no-files-found: error
