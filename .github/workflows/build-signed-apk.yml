name: Build signed APK (F-Droid)

on:
  push:
    tags:
      - "*-f-droid"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;36.0.0"
          yes | sdkmanager --licenses
          echo "APKSIGNER=$ANDROID_HOME/build-tools/34.0.0/apksigner" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Install native-wrapper dependencies
        working-directory: native-wrapper
        run: npm ci

      - name: Install holepunch-sidecar dependencies
        run: npm run holepunch:install

      - name: Prebuild Android (generate android/ tree)
        working-directory: native-wrapper
        run: npx expo prebuild --platform android --clean

      - name: Apply F-Droid de-Google fixes
        run: python3 scripts/fix-for-fdroid.py

      - name: Build unsigned release APK
        run: npm run mobile:android:release

      - name: Resolve version from version file
        id: ver
        run: |
          VERSION="$(grep -E '^version=' version | cut -d= -f2- | tr -d '[:space:]')"
          BUILD="$(grep -E '^buildVersionAndroid=' version | cut -d= -f2- | tr -d '[:space:]')"
          if [[ -z "$VERSION" ]]; then
            VERSION="$(node -p "require('./package.json').version")"
          fi
          FILE_VERSION="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "file_version=${FILE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD:-0}" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Missing required secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD"
            exit 1
          fi

          mkdir -p keys
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > keys/release-keystore.jks
          decoded_size=$(wc -c < keys/release-keystore.jks)
          if [ "$decoded_size" -lt 500 ]; then
            echo "Decoded keystore is only ${decoded_size} bytes — ANDROID_KEYSTORE_BASE64 is truncated or invalid"
            exit 1
          fi

          echo "ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS:-getnowhere}" >> "$GITHUB_ENV"

      - name: Sign release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FILE_VERSION: ${{ steps.ver.outputs.file_version }}
        run: |
          APK=$(find native-wrapper/builds -maxdepth 1 -name "GetNowHere-v*.apk" ! -name "*-signed.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "Release APK not found in native-wrapper/builds/"
            exit 1
          fi

          echo "Signing: $APK"

          "$APKSIGNER" sign \
            --ks keys/release-keystore.jks \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "${APK}.signed" \
            "$APK"

          mv "${APK}.signed" "$APK"
          # Canonical release name from version file (never the git tag / -f-droid suffix)
          CANONICAL="native-wrapper/builds/GetNowHere-${FILE_VERSION}.apk"
          if [[ "$APK" != "$CANONICAL" ]]; then
            mv -v "$APK" "$CANONICAL"
          fi
          sha256sum "$CANONICAL" | cut -d' ' -f1 > "$CANONICAL.sha256"
          "$APKSIGNER" verify --verbose "$CANONICAL"

          echo "SIGNED_APK=$CANONICAL" >> "$GITHUB_ENV"
          echo "SIGNED_APK_SHA=$CANONICAL.sha256" >> "$GITHUB_ENV"

      - name: Verify signed artifact
        run: |
          test -f "$SIGNED_APK"
          test -f "$SIGNED_APK_SHA"
          echo "Found signed APK: $(ls -lh "$SIGNED_APK")"
          echo "SHA256: $(cat "$SIGNED_APK_SHA")"

      - name: Remove signing files
        if: always()
        run: |
          rm -f keys/release-keystore.jks

      - name: Create GitHub release
        if: github.ref_type == 'tag' && endsWith(github.ref_name, '-f-droid')
        uses: softprops/action-gh-release@v2
        with:
          name: Get NowHere ${{ steps.ver.outputs.file_version }} (F-Droid)
          files: |
            ${{ env.SIGNED_APK }}
            ${{ env.SIGNED_APK_SHA }}
          generate_release_notes: true

      - name: Upload APK artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: getnowhere-signed-apk-${{ steps.ver.outputs.file_version }}
          path: |
            ${{ env.SIGNED_APK }}
            ${{ env.SIGNED_APK_SHA }}
          if-no-files-found: error
