name: Release Electron + sidecar

# Electron Forge Linux + Windows packages, plus an Arch .pkg.tar.zst of the linux-x64 tree.
# Packaged desktop uses native IPC (Unix socket / named pipe) for the UI↔sidecar bridge —
# not loopback WebSocket. @see docs/architecture/local-bridge-transport.md
# Arch recipe: desktop-electron/packaging/arch/PKGBUILD. @see docs/builds/github-pages-and-desktop.md

on:
  push:
    tags: ["v*"] # *-f-droid tags match v* but desktop jobs skip them (F-Droid APK only).
  workflow_dispatch:

concurrency:
  group: release-electron-sidecar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-linux:
    name: Electron + sidecar (Linux)
    if: github.event_name == 'workflow_dispatch' || !endsWith(github.ref_name, '-f-droid')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GNH_BUNDLE_NODE_VERSION: "24.14.1"
      # Packaged app: main.mjs spawns sidecar with GNH_BRIDGE_TRANSPORT=ipc (default).
      # Never set GNH_HOLEPUNCH_WS_URL in CI — it forces loopback WebSocket in the shell.
      GNH_HOLEPUNCH_WS_URL: ""
      # Embedded UI must not hard-code ws://; Electron injects gnhDesktop IPC at runtime.
      VITE_HOLEPUNCH_WS_URL: ""
      # Pin linuxdeploy (not the moving `continuous` tag). Hashes from the tagged assets.
      LINUXDEPLOY_URL: https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20250213-2/linuxdeploy-x86_64.AppImage
      LINUXDEPLOY_SHA256: 4648f278ab3ef31f819e67c30d50f462640e5365a77637d7e6f2ad9fd0b4522a
      LINUXDEPLOY_PLUGIN_URL: https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-appimage-x86_64.AppImage
      LINUXDEPLOY_PLUGIN_SHA256: 992d502a248e14ab185448ddf6f6e7d25558cb84d4623c354c3af350c25fccb3
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop-electron/package-lock.json
            holepunch-sidecar/package-lock.json

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg rpm libfuse2t64 squashfs-tools

      - name: Install UI deps
        run: npm ci

      - name: Build UI (dist/)
        run: npm run build

      - name: Install desktop deps
        working-directory: desktop-electron
        run: npm ci

      - name: Sync version from version file
        id: ver
        run: |
          VERSION="$(grep -E '^version=' version | cut -d= -f2- | tr -d '[:space:]')"
          if [[ -z "$VERSION" ]]; then
            VERSION="$(node -p "require('./package.json').version")"
          fi
          FILE_VERSION="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "file_version=${FILE_VERSION}" >> "$GITHUB_OUTPUT"
          npm version "${VERSION}" --prefix desktop-electron --no-git-tag-version --allow-same-version

      - name: Make Linux package
        working-directory: desktop-electron
        run: umask 022 && npm run make

      - name: Deb version wrapper
        working-directory: desktop-electron
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t debs < <(find out/make -type f -name '*.deb')
          if ((${#debs[@]} != 1)); then
            echo "ERROR: expected one deb, found ${#debs[@]}"
            printf '%s\n' "${debs[@]}"
            exit 1
          fi
          bash packaging/deb-cli-wrapper.sh "${debs[0]}" "$VERSION"

      - name: Build AppImage (linuxdeploy)
        working-directory: desktop-electron
        env:
          LINUXDEPLOY_OUTPUT_VERSION: ${{ steps.ver.outputs.file_version }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          FILE_VERSION: ${{ steps.ver.outputs.file_version }}
        run: |
          PACKAGED="out/GetNowHere-linux-x64"
          APPDIR="$(pwd)/AppDir"
          TARGET_APPIMAGE="Get_NowHere-${FILE_VERSION}-x86_64.AppImage"

          # Assemble AppDir from the Forge-packaged app
          mkdir -p "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp -r "$PACKAGED"/. "$APPDIR/"

          cat > "$APPDIR/AppRun" << 'APPRUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/getnowhere" "$@"
          APPRUN
          chmod +x "$APPDIR/AppRun"

          cat > "$APPDIR/usr/share/applications/getnowhere.desktop" << 'DESKTOP'
          [Desktop Entry]
          Name=Get NowHere
          Exec=getnowhere
          Icon=getnowhere
          Type=Application
          Categories=Network;
          DESKTOP

          cp icons/icon.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/getnowhere.png"
          cp icons/icon.png "$APPDIR/getnowhere.png"

          # Download pinned linuxdeploy + plugin into /tmp so they are never
          # inside desktop-electron/ and never picked up by the artifact glob
          mkdir -p /tmp/ld
          wget -q "$LINUXDEPLOY_URL" -O /tmp/ld/linuxdeploy-x86_64.AppImage
          wget -q "$LINUXDEPLOY_PLUGIN_URL" -O /tmp/ld/linuxdeploy-plugin-appimage-x86_64.AppImage
          echo "$LINUXDEPLOY_SHA256  /tmp/ld/linuxdeploy-x86_64.AppImage" | sha256sum -c -
          echo "$LINUXDEPLOY_PLUGIN_SHA256  /tmp/ld/linuxdeploy-plugin-appimage-x86_64.AppImage" | sha256sum -c -
          chmod +x /tmp/ld/linuxdeploy-x86_64.AppImage /tmp/ld/linuxdeploy-plugin-appimage-x86_64.AppImage

          # Produce AppImage; Electron bundles its own libs so skip dep scanning
          # linuxdeploy finds the plugin next to itself (/tmp/ld/)
          ARCH=x86_64 \
            /tmp/ld/linuxdeploy-x86_64.AppImage \
              --appdir "$APPDIR" \
              --desktop-file "$APPDIR/usr/share/applications/getnowhere.desktop" \
              --icon-file "$APPDIR/getnowhere.png" \
              --output appimage

          shopt -s nullglob
          produced=( ./*.AppImage )
          if ((${#produced[@]} != 1)); then
            echo "ERROR: expected exactly one AppImage, found ${#produced[@]}"
            ls -la ./*.AppImage || true
            exit 1
          fi
          if [[ "${produced[0]}" != "./${TARGET_APPIMAGE}" && "${produced[0]}" != "${TARGET_APPIMAGE}" ]]; then
            mv -v "${produced[0]}" "$TARGET_APPIMAGE"
          fi
          ls -la "$TARGET_APPIMAGE"

      - name: Collect artifacts
        env:
          FILE_VERSION: ${{ steps.ver.outputs.file_version }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p output
          # Forge nests: out/make/deb/x64/*.deb and out/make/zip/linux/x64/*.zip
          shopt -s nullglob
          files=(
            desktop-electron/out/make/deb/x64/*.deb
            desktop-electron/out/make/zip/linux/x64/*.zip
            desktop-electron/Get_NowHere-${FILE_VERSION}-x86_64.AppImage
          )
          if ((${#files[@]} == 0)); then
            mapfile -t files < <(find desktop-electron/out/make -type f \( -name '*.deb' -o -name '*.zip' \); find desktop-electron -maxdepth 1 -name 'Get_NowHere-v*-x86_64.AppImage')
          fi
          if ((${#files[@]} == 0)); then
            echo "ERROR: no desktop artifacts under desktop-electron/out/make"
            find desktop-electron/out -type f | head -100
            exit 1
          fi
          cp -v "${files[@]}" output/
          # Canonical names from version file (never the git tag / -f-droid suffix)
          (
            cd output
            for deb in *.deb; do
              [[ -f "$deb" ]] || continue
              target="Get_NowHere-${FILE_VERSION}-amd64.deb"
              [[ "$deb" == "$target" ]] || mv -v "$deb" "$target"
            done
            for zip in *.zip; do
              [[ -f "$zip" ]] || continue
              target="Get_NowHere-${FILE_VERSION}-linux-x64.zip"
              [[ "$zip" == "$target" ]] || mv -v "$zip" "$target"
            done
            ls -la
            sha256sum * > SHA256SUMS.txt
          )

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: getnowhere-linux-desktop-${{ steps.ver.outputs.file_version }}
          path: output/
          retention-days: 14

  desktop-windows:
    name: Electron + sidecar (Windows)
    if: github.event_name == 'workflow_dispatch' || !endsWith(github.ref_name, '-f-droid')
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      GNH_BUNDLE_NODE_VERSION: "24.14.1"
      GNH_HOLEPUNCH_WS_URL: ""
      VITE_HOLEPUNCH_WS_URL: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop-electron/package-lock.json
            holepunch-sidecar/package-lock.json

      - name: Install UI deps
        run: npm ci

      - name: Build UI (dist/)
        run: npm run build

      - name: Install desktop deps
        working-directory: desktop-electron
        run: npm ci

      - name: Sync version from version file
        id: ver
        shell: bash
        run: |
          VERSION="$(grep -E '^version=' version | cut -d= -f2- | tr -d '[:space:]')"
          if [[ -z "$VERSION" ]]; then
            VERSION="$(node -p "require('./package.json').version")"
          fi
          FILE_VERSION="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "file_version=${FILE_VERSION}" >> "$GITHUB_OUTPUT"
          npm version "${VERSION}" --prefix desktop-electron --no-git-tag-version --allow-same-version

      - name: Make Windows package
        working-directory: desktop-electron
        run: npm run make:win

      - name: Collect artifacts
        shell: bash
        env:
          FILE_VERSION: ${{ steps.ver.outputs.file_version }}
        run: |
          mkdir -p output
          shopt -s nullglob
          files=( desktop-electron/out/make/zip/win32/x64/*.zip )
          if ((${#files[@]} == 0)); then
            mapfile -t files < <(find desktop-electron/out/make -type f -name '*.zip')
          fi
          if ((${#files[@]} == 0)); then
            echo "ERROR: no Windows zip under desktop-electron/out/make"
            find desktop-electron/out -type f | head -100
            exit 1
          fi
          cp -v "${files[@]}" output/
          (
            cd output
            for zip in *.zip; do
              [[ -f "$zip" ]] || continue
              target="Get_NowHere-${FILE_VERSION}-win32-x64.zip"
              [[ "$zip" == "$target" ]] || mv -v "$zip" "$target"
            done
            ls -la
            sha256sum * > SHA256SUMS.txt
          )

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: getnowhere-windows-desktop-${{ steps.ver.outputs.file_version }}
          path: output/
          retention-days: 14

  desktop-arch:
    name: Electron + sidecar (Arch)
    needs: desktop-linux
    if: github.event_name == 'workflow_dispatch' || !endsWith(github.ref_name, '-f-droid')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    # base-devel digest from 2026-10-29 (conceal-core pin). pacman -Syu before use.
    # Container default shell is sh. @see docs/builds/github-pages-and-desktop.md
    container:
      image: archlinux/archlinux:base-devel@sha256:a3c048d95acbbf5acc15a9e9a727d3cae2ba2ac69aa8b24d8ccd4f60b3102f28
    defaults:
      run:
        shell: bash
    steps:
      - name: Provision build environment
        run: pacman -Syu --noconfirm --needed git namcap

      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version and verify Linux zip
        id: ver
        run: |
          set -euo pipefail
          VERSION="$(grep -E '^version=' version | cut -d= -f2- | tr -d '[:space:]')"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version: ${VERSION:-<empty>}"; exit 1; }
          FILE_VERSION="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "file_version=${FILE_VERSION}" >> "$GITHUB_OUTPUT"
          linux_dir=/tmp/linux-desktop
          mkdir -p "$linux_dir"
          echo "linux_dir=${linux_dir}" >> "$GITHUB_OUTPUT"

      - name: Download Linux desktop artifact
        uses: actions/download-artifact@v7
        with:
          name: getnowhere-linux-desktop-${{ steps.ver.outputs.file_version }}
          path: ${{ steps.ver.outputs.linux_dir }}

      - name: Prepare PKGBUILD
        id: prep
        run: |
          set -euo pipefail
          linux_dir="${{ steps.ver.outputs.linux_dir }}"
          (
            cd "$linux_dir"
            sha256sum -c SHA256SUMS.txt
          )
          zip="$linux_dir/Get_NowHere-${{ steps.ver.outputs.file_version }}-linux-x64.zip"
          [[ -f "$zip" ]] || { echo "missing $zip"; ls -la "$linux_dir"; exit 1; }
          bsdtar -tf "$zip" | grep -q 'GetNowHere-linux-x64/getnowhere' || {
            echo "zip is missing GetNowHere-linux-x64/getnowhere"
            bsdtar -tf "$zip" | head -40
            exit 1
          }

          useradd -m builder
          work=/home/builder/pkg
          mkdir -p "$work"
          cp desktop-electron/packaging/arch/PKGBUILD "$work/"
          cp desktop-electron/packaging/install-cli-wrapper.sh "$work/"
          cp desktop-electron/packaging/arch/getnowhere.desktop "$work/"
          cp desktop-electron/icons/icon.png "$work/getnowhere.png"
          cp LICENCE "$work/LICENSE"
          cp "$zip" "$work/"

          zip_sum=$(sha256sum "$work/Get_NowHere-${{ steps.ver.outputs.file_version }}-linux-x64.zip" | awk '{print $1}')
          desk_sum=$(sha256sum "$work/getnowhere.desktop" | awk '{print $1}')
          icon_sum=$(sha256sum "$work/getnowhere.png" | awk '{print $1}')
          license_sum=$(sha256sum "$work/LICENSE" | awk '{print $1}')
          sed -i \
            -e "s/^pkgver=.*/pkgver=${{ steps.ver.outputs.version }}/" \
            -e "s/ZIP_SHA256/${zip_sum}/" \
            -e "s/DESKTOP_SHA256/${desk_sum}/" \
            -e "s/ICON_SHA256/${icon_sum}/" \
            -e "s/LICENSE_SHA256/${license_sum}/" \
            "$work/PKGBUILD"
          grep -q 'ZIP_SHA256\|DESKTOP_SHA256\|ICON_SHA256\|LICENSE_SHA256' "$work/PKGBUILD" && {
            echo "PKGBUILD still has checksum placeholders"
            exit 1
          }
          bash -n "$work/PKGBUILD"
          chown -R builder: "$work"
          echo "work=${work}" >> "$GITHUB_OUTPUT"

      - name: Build package as unprivileged user
        # --nodeps: depends= are runtime-only; packaging is a prebuilt zip. Install job verifies via pacman -U.
        run: su builder -c "cd '${{ steps.prep.outputs.work }}' && makepkg --nodeps --noconfirm --log"

      - name: Check package
        working-directory: ${{ steps.prep.outputs.work }}
        env:
          FILE_VERSION: ${{ steps.ver.outputs.file_version }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(ls -1 getnowhere-*.pkg.tar.zst)
          if ((${#pkgs[@]} != 1)); then
            echo "ERROR: expected one package, found ${#pkgs[@]}"
            ls -la
            exit 1
          fi
          pkg=${pkgs[0]}
          # elfpaths (module elffiles.py): treats /opt as "questionable" even for /opt/$pkgname.
          namcap --exclude=elfpaths PKGBUILD "$pkg" | tee namcap.out
          if grep -q ' E: ' namcap.out; then
            echo "namcap reported errors:"
            grep ' E: ' namcap.out || true
            exit 1
          fi
          pacman -Qip "$pkg"
          files=$(pacman -Qlp "$pkg")
          echo "$files"
          bsdtar -tvf "$pkg" opt/getnowhere/getnowhere | grep -q '^-rwx' || {
            echo "opt/getnowhere/getnowhere missing or not executable"
            exit 1
          }
          closed=$(bsdtar -tvf "$pkg" | awk '$1 ~ /^d/ && substr($1, 10, 1) != "x" { print }')
          if [[ -n "$closed" ]]; then
            echo "directories are not world-traversable:"
            echo "$closed"
            exit 1
          fi
          bsdtar -tvf "$pkg" usr/bin/getnowhere | grep -q '^-rwx' || {
            echo "usr/bin/getnowhere wrapper missing or not executable"
            exit 1
          }
          bsdtar -xOf "$pkg" usr/bin/getnowhere | grep -q "printf '%s\\\\n' '${VERSION}'" || {
            echo "usr/bin/getnowhere does not print ${VERSION}"
            exit 1
          }
          grep -q '/usr/share/applications/getnowhere.desktop$' <<< "$files"
          grep -q '/usr/share/licenses/getnowhere/LICENSE$' <<< "$files"
          canonical="Get_NowHere-${FILE_VERSION}-x86_64.pkg.tar.zst"
          [[ "$pkg" == "$canonical" ]] || mv -v "$pkg" "$canonical"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          sha256sum "$canonical" > SHA256SUMS.txt
          cp "$canonical" SHA256SUMS.txt "$GITHUB_WORKSPACE/dist/"
          ls -la "$GITHUB_WORKSPACE/dist"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: getnowhere-arch-desktop-${{ steps.ver.outputs.file_version }}
          path: dist/
          retention-days: 14

  desktop-arch-test:
    name: Install Arch package
    needs: desktop-arch
    if: github.event_name == 'workflow_dispatch' || !endsWith(github.ref_name, '-f-droid')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    # base, not base-devel: a fat image would hide missing runtime depends.
    # Digest pulled 2026-10-29 (same pin as conceal-core).
    container:
      image: archlinux/archlinux:base@sha256:e4954feb61c332472f9cbf0e797a23be64434cf71db429349976192b4de782fc
    defaults:
      run:
        shell: bash
    steps:
      - name: Update base image
        run: pacman -Syu --noconfirm

      - name: Download Arch package
        uses: actions/download-artifact@v7
        with:
          pattern: getnowhere-arch-desktop-*
          merge-multiple: true
          path: dist

      - name: Install, check libraries, remove
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS.txt
          pkg=$(ls Get_NowHere-*.pkg.tar.zst)
          pacman -U --noconfirm "$pkg"
          test -x /usr/bin/getnowhere
          test -f /usr/share/applications/getnowhere.desktop
          id tester >/dev/null 2>&1 || useradd -m tester
          su tester -s /bin/bash -c 'test -x /opt/getnowhere && test -x /opt/getnowhere/getnowhere'
          ver=$(printf '%s\n' "$pkg" | sed -n 's/^Get_NowHere-v\(.*\)-x86_64\.pkg\.tar\.zst$/\1/p')
          [[ -n "$ver" ]] || { echo "could not parse version from $pkg"; exit 1; }
          got=$(timeout 5 su tester -s /bin/bash -c 'getnowhere --version')
          [[ "$got" == "$ver" ]] || { echo "expected $ver, got $got"; exit 1; }
          got=$(timeout 5 su tester -s /bin/bash -c 'getnowhere -v')
          [[ "$got" == "$ver" ]] || { echo "expected $ver from -v, got $got"; exit 1; }
          test -f /usr/share/icons/hicolor/256x256/apps/getnowhere.png
          ldd /opt/getnowhere/getnowhere > ldd.out
          cat ldd.out
          if grep -q 'not found' ldd.out; then
            echo "missing shared libraries"
            exit 1
          fi
          pacman -R --noconfirm getnowhere
          test ! -e /usr/bin/getnowhere
          test ! -d /opt/getnowhere

  release:
    name: Draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') && !endsWith(github.ref_name, '-f-droid')
    needs: [desktop-linux, desktop-windows, desktop-arch-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version from version file
        id: ver
        run: |
          VERSION="$(grep -E '^version=' version | cut -d= -f2- | tr -d '[:space:]')"
          if [[ -z "$VERSION" ]]; then
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "file_version=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: getnowhere-*-desktop-*
          merge-multiple: true
          path: release-assets

      - name: Combined checksums
        id: collect
        run: |
          cd release-assets
          rm -f SHA256SUMS.txt
          sha256sum *.deb *.zip *.AppImage *.pkg.tar.zst > SHA256SUMS.txt
          ls -la
          echo "hash_block<<EOF" >> "$GITHUB_OUTPUT"
          cat SHA256SUMS.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: Get NowHere ${{ steps.ver.outputs.file_version }}
          files: |
            release-assets/*.deb
            release-assets/*.AppImage
            release-assets/*.zip
            release-assets/*.pkg.tar.zst
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
          body: |
            **Get NowHere — desktop (Electron + sidecar, native IPC bridge)**

            - **Linux:** `.AppImage` (Debian/Ubuntu + Arch), `.deb` + `.zip`
            - **Arch / Omarchy:** `.pkg.tar.zst` (`sudo pacman -U`)
            - **Version:** `getnowhere -v` or `getnowhere --version` prints the bare version and exits (`.deb` and Arch package)
            - **Windows:** `.zip` (extract and run `getnowhere.exe`)
            - **Bridge:** UI ↔ sidecar over OS local IPC (not loopback WebSocket)
            - **Artifact version:** from repo `version` file (`${{ steps.ver.outputs.file_version }}`), not the git tag name

            ### Checksums
            ```
            ${{ steps.collect.outputs.hash_block }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
