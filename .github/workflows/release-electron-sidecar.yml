name: Release Electron + sidecar

# Electron Forge Linux + Windows packages (Electron + bundled sidecar + embedded Vite UI).
# @see docs/builds/github-pages-and-desktop.md

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-electron-sidecar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-linux:
    name: Electron + sidecar (Linux)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop-electron/package-lock.json
            holepunch-sidecar/package-lock.json

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg rpm

      - name: Install UI deps
        run: npm ci

      - name: Build UI (dist/)
        run: npm run build

      - name: Install desktop deps
        working-directory: desktop-electron
        run: npm ci

      # Tag v0.1.2 → package version 0.1.2 so Forge names include …-0.1.2-… / _0.1.2_
      - name: Sync version from tag
        id: ver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            BASE="$(node -p "require('./desktop-electron/package.json').version")"
            # Hyphen only — upload-artifact names disallow '+'
            VERSION="${BASE}-ci.${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          npm version "${VERSION}" --prefix desktop-electron --no-git-tag-version --allow-same-version
          echo "Desktop package version → ${VERSION}"

      - name: Make Linux package
        working-directory: desktop-electron
        env:
          GNH_BUNDLE_NODE_VERSION: "24.14.1"
        run: npm run make

      - name: Collect artifacts
        run: |
          mkdir -p output
          # Forge nests: out/make/deb/x64/*.deb and out/make/zip/linux/x64/*.zip
          shopt -s nullglob
          files=(
            desktop-electron/out/make/deb/x64/*.deb
            desktop-electron/out/make/zip/linux/x64/*.zip
          )
          if ((${#files[@]} == 0)); then
            mapfile -t files < <(find desktop-electron/out/make -type f \( -name '*.deb' -o -name '*.zip' \))
          fi
          if ((${#files[@]} == 0)); then
            echo "ERROR: no desktop artifacts under desktop-electron/out/make"
            find desktop-electron/out -type f | head -100
            exit 1
          fi
          cp -v "${files[@]}" output/
          ls -la output
          (
            cd output
            sha256sum * > SHA256SUMS.txt
          )

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: getnowhere-linux-desktop-${{ steps.ver.outputs.version }}
          path: output/
          retention-days: 14

  desktop-windows:
    name: Electron + sidecar (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop-electron/package-lock.json
            holepunch-sidecar/package-lock.json

      - name: Install UI deps
        run: npm ci

      - name: Build UI (dist/)
        run: npm run build

      - name: Install desktop deps
        working-directory: desktop-electron
        run: npm ci

      - name: Sync version from tag
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            BASE="$(node -p "require('./desktop-electron/package.json').version")"
            VERSION="${BASE}-ci.${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          npm version "${VERSION}" --prefix desktop-electron --no-git-tag-version --allow-same-version
          echo "Desktop package version → ${VERSION}"

      - name: Make Windows package
        working-directory: desktop-electron
        env:
          GNH_BUNDLE_NODE_VERSION: "24.14.1"
        run: npm run make:win

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output | Out-Null
          $files = Get-ChildItem -Path desktop-electron/out/make/zip/win32/x64 -Filter *.zip -ErrorAction SilentlyContinue
          if (-not $files) {
            $files = Get-ChildItem -Path desktop-electron/out/make -Recurse -Filter *.zip -ErrorAction SilentlyContinue
          }
          if (-not $files) {
            Write-Error "ERROR: no Windows zip under desktop-electron/out/make"
            Get-ChildItem -Path desktop-electron/out -Recurse -File | Select-Object -First 100
            exit 1
          }
          $files | Copy-Item -Destination output -Verbose
          Get-ChildItem output
          Push-Location output
          Get-ChildItem -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content SHA256SUMS.txt
          Pop-Location

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: getnowhere-windows-desktop-${{ steps.ver.outputs.version }}
          path: output/
          retention-days: 14

  release:
    name: Draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop-linux, desktop-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Resolve version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: getnowhere-*-desktop-*
          merge-multiple: true
          path: release-assets

      - name: Combined checksums
        id: collect
        run: |
          cd release-assets
          rm -f SHA256SUMS.txt
          sha256sum *.deb *.zip > SHA256SUMS.txt
          ls -la
          echo "hash_block<<EOF" >> "$GITHUB_OUTPUT"
          cat SHA256SUMS.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Get NowHere v${{ steps.ver.outputs.version }}
          files: |
            release-assets/*.deb
            release-assets/*.zip
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
          body: |
            **Get Now Here — desktop (Electron + sidecar)**

            - **Linux:** `.deb` + `.zip`
            - **Windows:** `.zip` (extract and run `getnowhere.exe`)

            ### Checksums
            ```
            ${{ steps.collect.outputs.hash_block }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
