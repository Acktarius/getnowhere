name: Release Electron + sidecar

# Electron Forge Linux + Windows packages (Electron + bundled sidecar + embedded Vite UI).
# Packaged desktop uses native IPC (Unix socket / named pipe) for the UI↔sidecar bridge —
# not loopback WebSocket. @see docs/architecture/local-bridge-transport.md

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-electron-sidecar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-linux:
    name: Electron + sidecar (Linux)
    runs-on: ubuntu-24.04
    env:
      GNH_BUNDLE_NODE_VERSION: "24.14.1"
      # Packaged app: main.mjs spawns sidecar with GNH_BRIDGE_TRANSPORT=ipc (default).
      # Never set GNH_HOLEPUNCH_WS_URL in CI — it forces loopback WebSocket in the shell.
      GNH_HOLEPUNCH_WS_URL: ""
      # Embedded UI must not hard-code ws://; Electron injects gnhDesktop IPC at runtime.
      VITE_HOLEPUNCH_WS_URL: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop-electron/package-lock.json
            holepunch-sidecar/package-lock.json

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg rpm libfuse2t64 squashfs-tools

      - name: Install UI deps
        run: npm ci

      - name: Build UI (dist/)
        run: npm run build

      - name: Install desktop deps
        working-directory: desktop-electron
        run: npm ci

      # Tag v0.1.2 → package version 0.1.2 so Forge names include …-0.1.2-… / _0.1.2_
      - name: Sync version from tag
        id: ver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            BASE="$(node -p "require('./desktop-electron/package.json').version")"
            # Hyphen only — upload-artifact names disallow '+'
            VERSION="${BASE}-ci.${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          npm version "${VERSION}" --prefix desktop-electron --no-git-tag-version --allow-same-version
          echo "Desktop package version → ${VERSION}"

      - name: Make Linux package
        working-directory: desktop-electron
        run: npm run make

      - name: Build AppImage (linuxdeploy)
        working-directory: desktop-electron
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          PACKAGED="out/GetNowHere-linux-x64"
          APPDIR="$(pwd)/AppDir"

          # Assemble AppDir from the Forge-packaged app
          mkdir -p "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp -r "$PACKAGED"/. "$APPDIR/"

          cat > "$APPDIR/AppRun" << 'APPRUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/getnowhere" "$@"
          APPRUN
          chmod +x "$APPDIR/AppRun"

          cat > "$APPDIR/usr/share/applications/getnowhere.desktop" << 'DESKTOP'
          [Desktop Entry]
          Name=Get NowHere
          Exec=getnowhere
          Icon=getnowhere
          Type=Application
          Categories=Network;
          DESKTOP

          cp icons/icon.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/getnowhere.png"
          cp icons/icon.png "$APPDIR/getnowhere.png"

          # Download linuxdeploy + AppImage output plugin (both in same dir for discovery)
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage" \
               -O linuxdeploy
          wget -q "https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage" \
               -O linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-appimage-x86_64.AppImage

          # Produce AppImage; Electron bundles its own libs so skip dep scanning
          ARCH=x86_64 VERSION="$VERSION" \
            ./linuxdeploy \
              --appdir "$APPDIR" \
              --desktop-file "$APPDIR/usr/share/applications/getnowhere.desktop" \
              --icon-file "$APPDIR/getnowhere.png" \
              --output appimage

          ls -la ./*.AppImage

      - name: Collect artifacts
        run: |
          mkdir -p output
          # Forge nests: out/make/deb/x64/*.deb and out/make/zip/linux/x64/*.zip
          shopt -s nullglob
          files=(
            desktop-electron/out/make/deb/x64/*.deb
            desktop-electron/out/make/zip/linux/x64/*.zip
            desktop-electron/*.AppImage
          )
          if ((${#files[@]} == 0)); then
            mapfile -t files < <(find desktop-electron/out/make -type f \( -name '*.deb' -o -name '*.zip' \); find desktop-electron -maxdepth 1 -name '*.AppImage')
          fi
          if ((${#files[@]} == 0)); then
            echo "ERROR: no desktop artifacts under desktop-electron/out/make"
            find desktop-electron/out -type f | head -100
            exit 1
          fi
          cp -v "${files[@]}" output/
          ls -la output
          (
            cd output
            sha256sum * > SHA256SUMS.txt
          )

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: getnowhere-linux-desktop-${{ steps.ver.outputs.version }}
          path: output/
          retention-days: 14

  desktop-windows:
    name: Electron + sidecar (Windows)
    runs-on: windows-latest
    env:
      GNH_BUNDLE_NODE_VERSION: "24.14.1"
      GNH_HOLEPUNCH_WS_URL: ""
      VITE_HOLEPUNCH_WS_URL: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop-electron/package-lock.json
            holepunch-sidecar/package-lock.json

      - name: Install UI deps
        run: npm ci

      - name: Build UI (dist/)
        run: npm run build

      - name: Install desktop deps
        working-directory: desktop-electron
        run: npm ci

      - name: Sync version from tag
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            BASE="$(node -p "require('./desktop-electron/package.json').version")"
            VERSION="${BASE}-ci.${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          npm version "${VERSION}" --prefix desktop-electron --no-git-tag-version --allow-same-version
          echo "Desktop package version → ${VERSION}"

      - name: Make Windows package
        working-directory: desktop-electron
        run: npm run make:win

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output | Out-Null
          $files = Get-ChildItem -Path desktop-electron/out/make/zip/win32/x64 -Filter *.zip -ErrorAction SilentlyContinue
          if (-not $files) {
            $files = Get-ChildItem -Path desktop-electron/out/make -Recurse -Filter *.zip -ErrorAction SilentlyContinue
          }
          if (-not $files) {
            Write-Error "ERROR: no Windows zip under desktop-electron/out/make"
            Get-ChildItem -Path desktop-electron/out -Recurse -File | Select-Object -First 100
            exit 1
          }
          $files | Copy-Item -Destination output -Verbose
          Get-ChildItem output
          Push-Location output
          Get-ChildItem -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content SHA256SUMS.txt
          Pop-Location

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: getnowhere-windows-desktop-${{ steps.ver.outputs.version }}
          path: output/
          retention-days: 14

  release:
    name: Draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop-linux, desktop-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Resolve version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: getnowhere-*-desktop-*
          merge-multiple: true
          path: release-assets

      - name: Combined checksums
        id: collect
        run: |
          cd release-assets
          rm -f SHA256SUMS.txt
          sha256sum *.deb *.zip *.AppImage > SHA256SUMS.txt
          ls -la
          echo "hash_block<<EOF" >> "$GITHUB_OUTPUT"
          cat SHA256SUMS.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Get NowHere v${{ steps.ver.outputs.version }}
          files: |
            release-assets/*.deb
            release-assets/*.AppImage
            release-assets/*.zip
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
          body: |
            **Get NowHere — desktop (Electron + sidecar, native IPC bridge)**

            - **Linux:** `.AppImage` (Debian/Ubuntu + Arch), `.deb` + `.zip`
            - **Windows:** `.zip` (extract and run `getnowhere.exe`)
            - **Bridge:** UI ↔ sidecar over OS local IPC (not loopback WebSocket)

            ### Checksums
            ```
            ${{ steps.collect.outputs.hash_block }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
